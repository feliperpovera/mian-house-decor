<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you — Mian House &amp; Decor</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/img/logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bone:#F7F4EF;--paper:#FFFDFA;--ink:#242320;--ink-2:#4A4740;--ink-3:#7C776C;
  --brass:#A98F5F;--brass-d:#8C7444;--line:#DED7CA;--ease:cubic-bezier(.22,.61,.36,1)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:28px;
  background:var(--bone);color:var(--ink);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
.card{max-width:520px;width:100%;text-align:center;background:var(--paper);
  border:1px solid var(--line);border-radius:22px;padding:clamp(30px,6vw,54px);
  box-shadow:0 8px 24px rgba(36,35,32,.10),0 32px 72px rgba(36,35,32,.12)}
img.mark{height:24px;width:auto;margin:0 auto 30px}
.tick{width:66px;height:66px;margin:0 auto 24px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(150deg,#EFE6D2,#E2D7BE);color:var(--brass-d)}
.tick svg{width:30px;height:30px}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:400;margin:0;
  font-size:clamp(2rem,5vw,2.7rem);line-height:1.1;letter-spacing:-.015em}
p{margin:16px 0 0;color:var(--ink-2)}
.small{margin-top:10px;font-size:.87rem;color:var(--ink-3)}
.actions{display:grid;gap:11px;margin-top:32px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;
  padding:0 26px;border-radius:100px;border:1px solid var(--line);background:transparent;
  color:var(--ink);text-decoration:none;font-size:.95rem;font-weight:500;
  transition:transform .25s var(--ease),box-shadow .25s var(--ease),background .2s,border-color .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(36,35,32,.07),0 16px 40px rgba(36,35,32,.08)}
.btn--brass{background:var(--brass);border-color:var(--brass);color:#fff}
.btn--brass:hover{background:var(--brass-d);border-color:var(--brass-d)}
.btn svg{width:18px;height:18px;flex:none}
@media (prefers-reduced-motion:reduce){*{transition-duration:.001ms!important}}
</style>
</head>
<body>
<main class="card">
  <img class="mark" src="assets/img/wordmark.png" alt="Mian House &amp; Decor">
  <div class="tick" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
  </div>
  <h1>Thank you — we got it.</h1>
  <p>Your request is in our inbox. We'll get back to you with a quote within 24 hours.</p>
  <p class="small">In a hurry? Message us on WhatsApp and we'll usually price it the same day.</p>
  <div class="actions">
    <a class="btn btn--brass" href="https://wa.me/17863488650?text=Hi%20Mian%20House%20%26%20Decor%2C%20I%20just%20sent%20a%20quote%20request." target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.297-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
      WhatsApp us
    </a>
    <a class="btn" href="./">Back to the site</a>
  </div>
</main>
</body>
</html>
